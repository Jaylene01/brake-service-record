<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>WEIDE Luxury Brake Service Record</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">WEIDE LUXURY</p>
          <h1>Brake Service Record</h1>
          <p class="tagline">专注刹车，只做刹车</p>
        </div>
        <button class="icon-button" id="printBtn" type="button" aria-label="Print service record">⌘</button>
      </header>

      <section class="stats-grid" aria-label="Dashboard">
        <article>
          <span>Total Records</span>
          <strong id="totalRecords">0</strong>
        </article>
        <article>
          <span>Upcoming</span>
          <strong id="dueSoon">0</strong>
        </article>
        <article>
          <span>Last Service</span>
          <strong id="lastService">-</strong>
        </article>
      </section>

      <nav class="tabs" aria-label="Main views">
        <button class="tab is-active" data-view="form" type="button">New Service</button>
        <button class="tab" data-view="history" type="button">History</button>
        <button class="tab" data-view="card" type="button">Card</button>
      </nav>

      <section class="view is-active" id="formView">
        <form id="serviceForm" class="service-form">
          <section class="form-section">
            <h2>顾客资料</h2>
            <label>
              Record No. / 记录单号码
              <input id="recordNo" name="recordNo" readonly />
            </label>
            <label>
              Customer Name
              <input id="customerName" name="customerName" autocomplete="name" required />
            </label>
            <label>
              WhatsApp
              <input id="whatsapp" name="whatsapp" inputmode="tel" placeholder="012-345 6789" />
            </label>
          </section>

          <section class="form-section">
            <h2>车辆资料</h2>
            <div class="field-row">
              <label>
                Car Plate
                <input id="carPlate" name="carPlate" autocapitalize="characters" required />
              </label>
              <label>
                Brand / Make
                <input id="vehicleBrand" name="vehicleBrand" placeholder="e.g. Toyota" required />
              </label>
            </div>
            <div class="field-row">
              <label>
                Model
                <input id="carModel" name="carModel" placeholder="e.g. Civic FC" />
              </label>
              <label>
                Current Mileage
                <input id="currentMileage" name="currentMileage" type="number" min="0" inputmode="numeric" required />
              </label>
            </div>
            <div class="field-row">
              <label>
                Service Date
                <input id="serviceDate" name="serviceDate" type="date" required />
              </label>
            </div>
          </section>

          <section class="form-section">
            <h2>Brake Fluid / Brake Oil</h2>
            <label>
              Fluid / Oil Type
              <select id="fluidType" name="fluidType">
                <option>DOT 3</option>
                <option selected>DOT 4</option>
                <option>DOT 5.1</option>
                <option>Other</option>
              </select>
            </label>
            <div class="field-row">
              <label>
                Next Change After
                <select id="intervalMonths" name="intervalMonths">
                  <option value="12">12 months</option>
                  <option value="18">18 months</option>
                  <option value="24" selected>24 months</option>
                </select>
              </label>
              <label>
                Mileage Interval
                <input id="mileageInterval" name="mileageInterval" type="number" min="1000" step="1000" value="40000" />
              </label>
            </div>
            <label>
              Technician Notes
              <textarea id="notes" name="notes" rows="3" placeholder="Service remarks, inspection notes, or customer request"></textarea>
            </label>
          </section>

          <section class="next-panel" aria-live="polite">
            <span>Next Brake Fluid Change</span>
            <strong id="nextDatePreview">-</strong>
            <span>Next Mileage</span>
            <strong id="nextMileagePreview">-</strong>
          </section>

          <button class="primary-button" id="saveRecordBtn" type="submit">Save Service Record</button>
        </form>
      </section>

      <section class="view" id="historyView">
        <div class="history-head">
          <h2>Service History</h2>
          <button class="ghost-button" id="clearSampleBtn" type="button">Clear All</button>
        </div>
        <div class="search-box">
          <input id="searchInput" placeholder="Search name, plate, model..." />
        </div>
        <div id="historyList" class="history-list"></div>
      </section>

      <section class="view" id="cardView">
        <article class="record-card" id="recordCard">
          <div class="card-header">
            <div>
              <p>WEIDE LUXURY</p>
              <h2>Electronic Service Record Card</h2>
            </div>
            <span id="cardStatus">Saved</span>
          </div>
          <dl class="card-details" id="cardDetails"></dl>
          <div class="card-actions">
            <button class="primary-button" id="shareBtn" type="button">WhatsApp Share</button>
            <button class="ghost-button" id="cardPrintBtn" type="button">PDF / Print</button>
          </div>
        </article>
      </section>
    </main>

    <template id="historyItemTemplate">
      <article class="history-item">
        <button type="button" class="history-main"></button>
        <button type="button" class="delete-button" aria-label="Delete record">×</button>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
